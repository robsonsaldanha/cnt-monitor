# Trecho do vhost cntoficial.com.br (/etc/nginx/sites-available/cntoficial.com.br) que serve o CNT Monitor.
# A home é o hub CNT (Node, porta 3480, repositório cnt-hub, fora deste); estes locations ficam antes do `location /`
# e levam o download e o ponto de encontro do acesso remoto para o serviço em 127.0.0.1:4070 (encontro.js).
    # changelog público (página estática gerada de servidor-vps/changelog/changelog.json; só o index.html é servido)
    location = /monitor/changelog { return 301 /monitor/changelog/; }
    location = /monitor/changelog/ {
        root /var/www/html_cntmonitor/servidor-vps/changelog;
        rewrite ^ /index.html break;   # só o index.html sai desta pasta
        default_type text/html;
        # add_header aqui anula os do server{}, então repetimos os de segurança
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "no-cache" always;
    }
    location = /baixar {
        proxy_pass http://127.0.0.1:4070;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /download/ {
        alias /var/www/cntmonitor_downloads/;
        default_type application/octet-stream;
        add_header Content-Disposition "attachment" always;
        add_header X-Content-Type-Options "nosniff" always;
        expires 1d;
    }
    # rotas do encontro: esperas longas de até 25 s (o /api/admin e /api/publico do hub continuam no hub)
    location ~ ^/api/(saude|esperar|receber|registrar|sair|enviar|conectar|responder)$ {
        proxy_pass http://127.0.0.1:4070;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 40s;
        client_max_body_size 64k;
    }
