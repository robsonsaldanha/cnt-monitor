# CNT Monitor: site, download e ponto de encontro do acesso remoto.
# Código em /var/www/html_cntmonitor (clone do repositório cnt-monitor). O bloco 443/SSL é posto pelo certbot (--nginx).
server {
    listen 80;
    listen [::]:80;
    server_name monitor.cntoficial.com.br;

    # IP real do visitante atrás da Cloudflare (o ponto de encontro limita as tentativas por IP)
    include /etc/nginx/snippets/cloudflare-real-ip.conf;

    root /var/www/html_cntmonitor/servidor-vps/site;
    index index.html;
    autoindex off;
    charset utf-8;
    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    location /estatico/ {
        alias /var/www/html_cntmonitor/src/ui/estatico/;
        expires 7d;
    }
    location /fontes/ {
        alias /var/www/html_cntmonitor/src/ui/fontes/;
        expires 30d;
    }

    # ponto de encontro: esperas longas de até 25 s
    location /api/ {
        proxy_pass http://127.0.0.1:4070;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 40s;
        client_max_body_size 64k;
    }
    # instaladores copiados da release pelo cnt-monitor-baixar.timer (/baixar redireciona para o mais novo)
    location /download/ {
        alias /var/www/cntmonitor_downloads/;
        default_type application/octet-stream;
        add_header Content-Disposition "attachment" always;
        add_header X-Content-Type-Options "nosniff" always;
        expires 1d;
    }
    location = /baixar {
        proxy_pass http://127.0.0.1:4070;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
