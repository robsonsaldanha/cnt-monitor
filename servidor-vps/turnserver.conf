# coturn do CNT Monitor: retransmissor de reserva, usado só quando a ligação direta entre os dois PCs falha.
# Ele repassa pacotes já criptografados (DTLS-SRTP) que não consegue ler. As credenciais são temporárias,
# geradas pelo ponto de encontro com o mesmo segredo (static-auth-secret, posto na instalação; não fica no git).
listening-port=3478
fingerprint
use-auth-secret
realm=cntoficial.com.br
external-ip=143.95.209.35
min-port=49160
max-port=49400
no-tls
no-dtls
no-cli
no-multicast-peers
no-loopback-peers
stale-nonce=600
user-quota=12
total-quota=120
max-bps=6000000
syslog
simple-log
# nunca retransmitir para a rede interna da VPS
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
