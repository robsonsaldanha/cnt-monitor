name: Build e teste no Windows

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependências Python
        run: python -m pip install --disable-pip-version-check -r build/requirements.txt

      - name: Testes da captura de tela
        run: python build/teste_captura.py

      - name: Testes das ventoinhas
        run: python build/teste_ventoinhas.py

      - name: Testes do medidor de FPS
        run: python build/teste_jogo.py

      - name: Testes das estatísticas de rede
        run: python build/teste_rede.py

      - name: Testes da rede por programa (RTP, sondas TCP/UDP, .log)
        run: python build/teste_rede_programa.py

      - name: Testes de segurança
        run: python build/teste_seguranca.py

      - name: Testes do acesso remoto
        run: python build/teste_remoto.py

      - name: Testes do acesso por ID (ponto de encontro em Node)
        run: python build/teste_encontro.py

      - name: Testes dos leitores do Linux (os que rodam em qualquer sistema)
        run: python build/teste_linux.py

      - name: LibreHardwareMonitor (sensores)
        shell: pwsh
        run: ./build/baixar-lhm.ps1

      - name: Driver PawnIO (temperatura da CPU)
        shell: pwsh
        run: |
          Invoke-WebRequest "https://github.com/namazso/PawnIO.Setup/releases/latest/download/PawnIO_setup.exe" -OutFile instalador/PawnIO_setup.exe
          Get-Item instalador/PawnIO_setup.exe | Format-List Name, Length

      - name: PresentMon (FPS dos jogos)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force pm, presentmon | Out-Null
          gh release download -R GameTechDev/PresentMon -p "PresentMon-*-x64.exe" -D pm
          $exe = Get-ChildItem pm\*.exe | Sort-Object { $_.Name.Length } | Select-Object -First 1
          Copy-Item $exe.FullName presentmon\PresentMon.exe
          Get-ChildItem pm, presentmon | Format-Table Name, Length

      - name: País e operadora dos IPs (DB-IP Lite, CC BY 4.0)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force geoip | Out-Null
          foreach ($tipo in 'country', 'asn') {
            $ok = $false
            foreach ($m in 0, 1) {
              $mes = (Get-Date).AddMonths(-$m).ToString('yyyy-MM')
              try {
                Invoke-WebRequest "https://download.db-ip.com/free/dbip-$tipo-lite-$mes.mmdb.gz" -OutFile "geoip\$tipo.gz"
                $ok = $true; break
              } catch { Write-Host "dbip-$tipo-lite-$mes indisponível" }
            }
            if (-not $ok) { throw "Não consegui baixar a base DB-IP ($tipo)" }
            $in = [IO.File]::OpenRead("geoip\$tipo.gz")
            $gz = New-Object IO.Compression.GZipStream($in, [IO.Compression.CompressionMode]::Decompress)
            $out = [IO.File]::Create("geoip\dbip-$tipo-lite.mmdb")
            $gz.CopyTo($out); $out.Close(); $gz.Close(); $in.Close()
            Remove-Item "geoip\$tipo.gz"
          }
          python -c "import maxminddb; r=maxminddb.open_database('geoip/dbip-asn-lite.mmdb'); print(r.get('1.1.1.1'))"
          Get-ChildItem geoip | Format-Table Name, Length
      - name: Gerar executáveis (PyInstaller)
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --console --name MonitorPCServico --icon instalador/icone.ico `
            --paths src --hidden-import win32timezone --hidden-import servicemanager `
            --hidden-import win32com.client --hidden-import pythoncom --hidden-import win32api `
            --hidden-import win32ts --hidden-import win32profile --hidden-import win32process --hidden-import win32security `
            --hidden-import win32crypt --collect-submodules paramiko --collect-submodules qrcode `
            --collect-all pythonnet --collect-all clr_loader `
            --hidden-import maxminddb --add-data "src/ui;ui" --add-data "lhm;lhm" --add-data "presentmon;presentmon" --add-data "geoip;geoip" src/servico.py
          pyinstaller --noconfirm --clean --windowed --name MonitorPC --icon instalador/icone.ico `
            --paths src --hidden-import pystray._win32 --hidden-import PIL.ImageTk --hidden-import PIL.ImageGrab `
            --collect-submodules qrcode --hidden-import zxingcpp src/bandeja.py
          pyinstaller --noconfirm --clean --console --name MonitorPCRemoto --icon instalador/icone.ico `
            --paths src --collect-all aiortc --collect-all av --collect-all aioice --collect-all pylibsrtp `
            --hidden-import win32clipboard --hidden-import PIL.ImageGrab --hidden-import PIL.BmpImagePlugin --hidden-import PIL.PngImagePlugin `
            --hidden-import win32ts --hidden-import win32security --hidden-import win32profile --hidden-import win32api --hidden-import win32file `
            --hidden-import win32com.shell src/remoto_agente.py
          Get-ChildItem dist | Format-Table Name

      - name: Teste do agente do acesso remoto empacotado
        run: python build/teste_agente_exe.py dist/MonitorPCRemoto/MonitorPCRemoto.exe

      - name: Teste 1 - serviço em modo console (admin)
        shell: pwsh
        run: |
          $p = Start-Process dist\MonitorPCServico\MonitorPCServico.exe -ArgumentList '--console','--segundos','55','--saida','teste-console.json' -PassThru -NoNewWindow -RedirectStandardOutput console.log -RedirectStandardError console-err.log
          Start-Sleep 20
          foreach ($i in 1..3) {
            try { Invoke-WebRequest "https://speed.cloudflare.com/__down?bytes=15000000" -OutFile "$env:TEMP\x.bin" -UseBasicParsing } catch { Write-Host $_ }
            try { Invoke-WebRequest "https://www.google.com" -UseBasicParsing | Out-Null } catch {}
          }
          $p.WaitForExit(150000) | Out-Null
          Get-Content console.log, console-err.log -ErrorAction SilentlyContinue | Select-Object -Last 40
          python build/resumo_teste.py teste-console.json

      - name: Gerar instalador (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Host }
          $versao = (Select-String -Path src/monitorpc/config.py -Pattern 'VERSAO = "(.+)"').Matches[0].Groups[1].Value
          & $iscc "/DVersao=$versao" instalador\monitorpc.iss
          # cópia com o nome antigo: as versões até a 2.6.x só reconhecem MonitorDoPC-Setup-*.exe na atualização automática
          Copy-Item "saida\CNTMonitor-Setup-$versao.exe" "saida\MonitorDoPC-Setup-$versao.exe"
          Get-ChildItem saida | Format-Table Name, Length

      - name: Teste 2 - instalar, rodar como serviço e consultar a API
        shell: pwsh
        run: |
          $setup = (Get-ChildItem saida\CNTMonitor-Setup-*.exe)[0].FullName
          Start-Process $setup -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/TASKS=pawnio,desktop','/LOG=setup.log' -Wait
          sc.exe query MonitorPC
          sc.exe query PawnIO
          Start-Sleep 20
          foreach ($i in 1..2) { try { Invoke-WebRequest "https://speed.cloudflare.com/__down?bytes=10000000" -OutFile "$env:TEMP\y.bin" -UseBasicParsing } catch {} }
          Start-Sleep 20
          New-Item -ItemType Directory -Force api | Out-Null
          foreach ($e in 'status','agora','rede','hardware','processos','lentidao','relatorio') {
            try { (Invoke-WebRequest "http://127.0.0.1:48731/api/$e" -UseBasicParsing).Content | Out-File -Encoding utf8 "api\api-$e.json" } catch { Write-Host "falhou $e : $_" }
          }
          (Invoke-WebRequest "http://127.0.0.1:48731/" -UseBasicParsing).StatusCode
          $prog = (Get-ChildItem api\api-agora.json).Length; Write-Host "agora.json: $prog bytes"
          Start-Process "C:\Program Files\CNT Monitor\MonitorPC.exe" -ArgumentList '--bandeja'
          Start-Sleep 6
          Get-Process MonitorPC, MonitorPCServico -ErrorAction SilentlyContinue | Format-Table Name, Id, WorkingSet64, CPU
          ./build/teste-acoes.ps1
          if (-not (Test-Path "C:\Program Files\CNT Monitor\remoto\MonitorPCRemoto.exe")) { throw "o agente do acesso remoto não foi instalado" }
          $fw = netsh advfirewall firewall show rule name="Monitor do PC (acesso remoto)" verbose | Out-String
          Write-Host $fw
          if ($fw -notmatch 'MonitorPCRemoto\.exe' -or $fw -notmatch 'UDP' -or $fw -notmatch 'LocalSubnet') { throw "a regra de firewall do acesso remoto (rede local) não foi criada" }
          # no servidor de build pode não haver ninguém logado na tela: aí o pedido é recusado, mas com o motivo escrito.
          # Erro sem mensagem (exceção no serviço) reprova a compilação.
          $tok = (Get-Content C:\ProgramData\MonitorPC\token.txt -Raw).Trim()
          foreach ($t in 'ajuda_pedir','ajuda_encerrar') {
            try { $r = Invoke-RestMethod -Method Post -Uri "http://127.0.0.1:48731/api/acao" -Headers @{ "X-Token" = $tok } -ContentType "application/json" -Body "{`"tipo`":`"$t`"}" -TimeoutSec 60; Write-Host "$t : ok=$($r.ok) msg=$($r.msg) estado=$($r.dados.estado)" } catch { Get-Content C:\ProgramData\MonitorPC\servico.log -ErrorAction SilentlyContinue | Select-Object -Last 30; throw "$t falhou no serviço: $_" }
            if (-not $r.ok -and -not $r.msg) { throw "$t foi recusado sem dizer o motivo" }
          }
          Copy-Item C:\ProgramData\MonitorPC\servico.log api\ -ErrorAction SilentlyContinue
          Get-Content C:\ProgramData\MonitorPC\servico.log -ErrorAction SilentlyContinue | Select-Object -Last 30
          python build/resumo_teste.py --api api

      - name: Teste 3 - desinstalar
        shell: pwsh
        run: |
          $un = "C:\Program Files\CNT Monitor\unins000.exe"
          Start-Process $un -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait
          Start-Sleep 5
          sc.exe query MonitorPC
          if (Test-Path "C:\Program Files\CNT Monitor\servico") { throw "não removeu os arquivos" }
          Write-Host "desinstalação OK"
          $global:LASTEXITCODE = 0

      - name: Guardar instalador e resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monitor-do-pc
          path: |
            saida/*.exe
            teste-console.json
            api/
            setup.log
            console*.log

  linux:
    # Ubuntu 22.04: o programa empacotado usa a glibc de onde foi gerado (2.35) e roda dali para cima
    # (Ubuntu 22.04+, Debian 12+, Mint 21+)
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pacotes do sistema (tela virtual, área de transferência, testes)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb xclip openbox x11-utils python3-tk iproute2

      - name: Dependências Python
        run: python -m pip install --disable-pip-version-check -r build/requirements-linux.txt

      - name: Testes das partes Linux (como root, para a captura de pacotes e o ping ICMP)
        run: sudo -E env "PATH=$PATH" python build/teste_linux.py

      - name: Testes de rede, rede por programa, segurança, ventoinhas e FPS
        run: for t in rede rede_programa seguranca ventoinhas jogo; do python build/teste_$t.py || exit 1; done

      - name: Testes do acesso remoto (numa tela virtual X11)
        run: xvfb-run -a -s "-screen 0 1600x900x24" python build/teste_remoto.py

      - name: Testes do acesso por ID (ponto de encontro em Node)
        run: python build/teste_encontro.py

      - name: País e operadora dos IPs (DB-IP Lite, CC BY 4.0)
        run: |
          mkdir -p geoip
          for tipo in country asn; do
            ok=0
            for m in 0 1; do
              mes=$(date -d "$(date +%Y-%m-15) -$m month" +%Y-%m)
              if curl -sfL "https://download.db-ip.com/free/dbip-$tipo-lite-$mes.mmdb.gz" -o "geoip/$tipo.gz"; then ok=1; break; fi
              echo "dbip-$tipo-lite-$mes indisponível"
            done
            [ "$ok" = 1 ] || { echo "Não consegui baixar a base DB-IP ($tipo)"; exit 1; }
            gunzip -c "geoip/$tipo.gz" > "geoip/dbip-$tipo-lite.mmdb" && rm "geoip/$tipo.gz"
          done
          ls -la geoip

      - name: Gerar o pacote .deb
        run: bash instalador/linux/montar-deb.sh

      - name: Teste do agente do acesso remoto empacotado
        run: xvfb-run -a python build/teste_agente_exe.py dist-linux/cnt-monitor-remoto/cnt-monitor-remoto

      - name: Instalar o .deb, rodar como serviço e consultar a API
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y ./saida/cnt-monitor_*_amd64.deb
          sleep 20
          systemctl is-active cnt-monitor
          systemctl is-enabled cnt-monitor
          curl -sf http://127.0.0.1:48731/api/v1/status | python3 -c "import json,sys; d=json.load(sys.stdin)['dados']; print(d); assert d['sistema']=='linux' and d['admin'] and d['rede_ok'] and not d['erros'], d"
          curl -sf -o /dev/null -w "página: %{http_code}\n" http://127.0.0.1:48731/
          TOK=$(sudo cat /var/lib/cnt-monitor/token.txt)
          for e in energia servicos inicializacao processos rede hardware; do
            curl -sf -H "X-Token: $TOK" "http://127.0.0.1:48731/api/$e" -o /dev/null || { echo "falhou $e"; exit 1; }
          done
          # no servidor de build não há ninguém na tela: o pedido é recusado, mas com o motivo escrito
          for t in ajuda_pedir ajuda_encerrar; do
            r=$(curl -s -X POST -H "X-Token: $TOK" -H "Content-Type: application/json" -d "{\"tipo\":\"$t\"}" http://127.0.0.1:48731/api/acao)
            echo "$t: $r"
            echo "$r" | python3 -c "import json,sys; r=json.load(sys.stdin); assert r['ok'] or r['msg'], r"
          done
          sudo tail -20 /var/lib/cnt-monitor/servico.log

      - name: Desinstalar
        run: |
          sudo apt-get remove -y cnt-monitor
          if systemctl is-active --quiet cnt-monitor; then echo "o serviço continuou rodando"; exit 1; fi
          test ! -e /opt/cnt-monitor/servico || { echo "não removeu os arquivos"; exit 1; }
          echo "desinstalação OK"

      - name: Guardar o pacote
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cnt-monitor-linux
          path: saida/*.deb

  release:
    needs: [windows, linux]
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: monitor-do-pc
          path: artefatos/windows

      - uses: actions/download-artifact@v4
        with:
          name: cnt-monitor-linux
          path: artefatos/linux

      - name: Versão e SHA-256
        id: versao
        run: |
          v=$(sed -n 's/^VERSAO = "\(.*\)"/\1/p' src/monitorpc/config.py)
          mkdir -p saida
          find artefatos -name "*.exe" -exec cp {} saida/ \;
          find artefatos -name "*.deb" -exec cp {} saida/ \;
          ls -la saida
          echo "v=$v" >> "$GITHUB_OUTPUT"
          echo "sha=$(sha256sum "saida/CNTMonitor-Setup-$v.exe" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "deb=$(sha256sum "saida/cnt-monitor_${v}_amd64.deb" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Publicar release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.versao.outputs.v }}
          name: CNT Monitor ${{ steps.versao.outputs.v }}
          target_commitish: ${{ github.sha }}
          # a primeira linha "SHA256:" é a do instalador do Windows (as versões antigas leem só ela)
          body: |
            **Windows:** baixe o **CNTMonitor-Setup-${{ steps.versao.outputs.v }}.exe**, dê dois cliques e siga o instalador (pede permissão de administrador). O MonitorDoPC-Setup é o mesmo arquivo, mantido para a atualização automática das versões antigas.

            **Linux (Ubuntu 22.04+, Debian 12+, Mint 21+):** baixe o **cnt-monitor_${{ steps.versao.outputs.v }}_amd64.deb** e instale com `sudo apt install ./cnt-monitor_${{ steps.versao.outputs.v }}_amd64.deb` (ou dois cliques, na Central de Programas).

            SHA256: ${{ steps.versao.outputs.sha }}
            SHA256 (deb): ${{ steps.versao.outputs.deb }}
          files: |
            saida/*.exe
            saida/*.deb
